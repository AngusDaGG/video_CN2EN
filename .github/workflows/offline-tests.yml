name: Offline tests
on:
  pull_request:
  push:
    branches: [main, master]
  merge_group:
    types: [checks_requested]
permissions:
  contents: read
concurrency:
  group: offline-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline-tests:
    name: Offline tests
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install "requests>=2.32.0"
      - name: Existing offline regression (nonempty)
        run: python -B -c "import sys,unittest; s=unittest.defaultTestLoader.discover('tests',pattern='test_*.py'); r=unittest.TextTestRunner(verbosity=2).run(s); sys.exit(0 if r.testsRun>len(r.skipped) and r.wasSuccessful() else 1)"
